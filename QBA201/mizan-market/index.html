ground:white;color:var(--ink)}.record{padding:18px 22px;background:#e4eee0;border-left:4px solid var(--green);margin:22px 0}.record p:last-child{margin-bottom:0}.warning{border-left:4px solid var(--gold);padding:17px 20px;background:#f5ead6;margin:20px 0}.warning p:last-child{margin-bottom:0}.locked{padding:40px 25px;background:white;border:1px dashed #b1c4b1}.role-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0}.role-tabs button.active{background:var(--ink);color:white}.document-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}.document{padding:25px;background:white;border:1px solid var(--line);border-top:3px solid var(--green)}.document h3{font-size:22px}.document dl{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);font-size:15px;gap:8px;margin:20px 0}.document dt{color:var(--muted)}.document dd{font-weight:700;margin:0;text-align:right}.document ul{padding-left:20px;font-size:14px}.table-wrap{overflow-x:auto;margin:20px 0}table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:12px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{font-weight:650;background:#e7ece3}.analysis{border-top:1px solid var(--line);margin-top:25px;padding-top:25px}.calculation{font-size:19px;font-weight:650;background:#e7efe2;padding:16px;margin:14px 0}.metric{font-size:35px;letter-spacing:-.03em;font-weight:700;line-height:1.3}.profit{color:var(--green)}.loss{color:var(--red)}.controls{display:flex;gap:30px;flex-wrap:wrap;margin:24px 0}.controls label{min-width:220px;flex:1}.controls input[type=range]{display:block;width:100%;padding:0;margin-top:13px}.stress{margin-top:25px;padding:25px 28px;border:1px solid var(--line);background:white}.stress svg{display:block;max-width:100%;height:auto}#notes{background:#f8edd5;border:1px solid #d1b678;padding:24px;margin-top:30px;font-size:14px}.navigation{display:flex;align-items:center;justify-content:space-between;padding-top:26px;margin-top:28px;border-top:1px solid var(--line)}#page-count{font-size:12px;color:var(--muted)}#message{color:var(--red);font-size:14px;margin-top:18px}.page-footer{display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap;padding:20px 4vw;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}.rubric{display:grid;gap:12px}.rubric label{font-size:15px;background:white;padding:14px;border:1px solid var(--line)}.rubric input{margin-right:12px;width:18px;height:18px;vertical-align:middle}summary{cursor:pointer;font-weight:650;margin:12px 0}.score{font-size:22px;font-weight:750}.rule{margin:20px 0;padding-bottom:20px;border-bottom:1px solid var(--line)}.rule b{display:block;margin-bottom:8px}li{margin-bottom:8px}[hidden]{display:none!important}@media(max-width:1050px){.workspace{grid-template-columns:145px minmax(0,1fr);gap:25px}.utilities{gap:10px}header{align-items:flex-start}.facts{gap:14px}.document-grid{grid-template-columns:1fr}.lead{font-size:19px}}@media(max-width:700px){:root{font-size:16px}header{padding:16px;display:block}.brand{font-size:18px}.utilities{margin-top:15px;gap:12px}.utilities button,.utilities a{font-size:11px}.workspace{display:block;padding:16px 18px 30px}nav{flex-direction:row;overflow-x:auto;margin-bottom:20px}nav button{flex:0 0 auto;padding:8px}nav .nav-name{display:none}.statusbar{font-size:10px;margin-bottom:22px}h1{font-size:36px}.lead{font-size:19px}.split,.options,.facts{grid-template-columns:1fr}.facts{gap:0}.fact{padding:13px 0}.fact b{font-size:28px}.memo{padding:21px;margin:20px 0}.document{padding:19px}.document dl{font-size:14px}h2{font-size:22px}.quote{font-size:25px}.controls{display:block}.controls label{margin-bottom:25px;min-width:0}.stress{padding:20px 16px}.page-footer{padding:18px}.role-tabs{gap:6px}.role-tabs button{font-size:12px}th,td{padding:9px;font-size:12px}.choice{padding:17px}.choice.selected{padding:16px}}@media print{header,nav,.utilities,.navigation,.page-footer,#notes,.actions,textarea,.role-tabs{display:none}.workspace{display:block;padding:0}h1{font-size:28px}.memo,.document,.warning,.record,.stress{break-inside:avoid}body{background:white}}

<script id="case-data" type="application/json">{"cash": 10000, "diligence": {"savings": 1800, "service": 1800, "both": 3600, "none": 0}, "initialSavings": {"n": 16, "mean": 300, "sd": 80}, "initialService": {"n": 36, "mean": 1.6, "sigma": 2.4}, "savingsAudit": {"n": 64, "mean": 306, "sd": 80}, "serviceAudit": {"n": 100, "mean": 1.35, "sigma": 2.4}}</script>
<script>'use strict';
(() => {
  const $ = selector => document.querySelector(selector);
  const DATA = JSON.parse($('#case-data').textContent);
  const TEAM_PACK = JSON.parse($('#team-pack').textContent);
  const KEY = 'qba201-mizan-contract-20261107-v2';
  const escape = value => String(value).replace(/[&<>"']/g, char =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
  const money = value => 'AED ' + Number(value).toLocaleString('en-US',{maximumFractionDigits:0});
  const fixed = (value, digits=4) => Number(value).toFixed(digits);
  const stages = [
    ['mandate','The board mandate','You have until 5 p.m.'],
    ['people','Behind the recommendation','Whose risk are you carrying?'],
    ['pitch','The vendor’s pitch','“The pilot already proves it.”'],
    ['initial','Your first position','Put your name to a recommendation.'],
    ['evidence','The internal evidence','Two departments. Two unresolved claims.'],
    ['diligence','Buy information','What is worth finding out next?'],
    ['results','The sealed report','Your evidence has a price.'],
    ['decision','The board hearing','A recommendation, with conditions.'],
    ['stress','Inspect possible futures','Would your decision survive this?'],
    ['debrief','Debrief and accountability','What would you tell the owner?'],
  ];
  const actions = [
    {id:'launch',title:'A · Sign the full contract',detail:'Pay AED 7,200 setup now. Commit to AED 240 per operating day for 180 days.'},
    {id:'reserve',title:'B · Buy seven days',detail:'Pay a non-refundable AED 1,000 reservation. Keep the quoted rate while collecting or reviewing more evidence.'},
    {id:'negotiate',title:'C · Take the staged-payment offer',detail:'Pay AED 3,600 now and AED 3,600 after 30 operating days. The daily licence rises to AED 270 for the same 180-day horizon.'},
    {id:'decline',title:'D · Decline the offer',detail:'Keep the present process. Preserve cash and accept the possibility of missing worthwhile savings.'},
  ];
  const initialActions = actions.map(action=>action.id==='negotiate'
    ? {id:'negotiate',title:'C · Seek different terms',detail:'Ask the vendor to stage implementation payments or offer an exit clause. The price and conditions would need agreement.'}
    : action);
  const plans = [
    {id:'savings',title:'A · Independent savings audit',detail:'AED 1,800. Audit 64 preselected days from the trial archive, disjoint from the initial 16. Service evidence stays as it is.'},
    {id:'service',title:'B · Independent dispatch audit',detail:'AED 1,800. Audit 100 preselected dispatches from trial logs, disjoint from the initial 36. Savings evidence stays as it is.'},
    {id:'both',title:'C · Buy both audits',detail:'AED 3,600. Resolve more of the evidence gap, using cash that would otherwise fund setup.'},
    {id:'none',title:'D · Buy neither audit',detail:'AED 0. Make the decision using the two internal reports and the vendor’s offer.'},
  ];
  const roles = {
    finance: {name:'Finance director',quote:'“I can authorise AED 10,000 today. A saving that does not cover the entire contract is not a saving for us.”',
      text:'You answer to an owner who has already funded a warehouse move. Count the daily licence and the implementation charge. Future licence bills can be paid from operating cash flow, but the full setup charge must come from today’s cash. Audit and reservation fees come from the same cash authorisation.',
      question:'What mean gross saving would cover the full 180-day contract? Which choices would leave enough cash to implement it?'},
    operations: {name:'Operations director',quote:'“Next week’s campaign will increase pressure on the depot. Waiting also has a cost.”',
      text:'The current manual batching process often requires overtime. A new service could reduce labour costs. Implementation takes five working days. You can launch in time for next week’s campaign if the contract is signed today. Buying seven days preserves the price but misses the opening week.',
      question:'How much uncertainty would you accept to start on time? What evidence would make a delay worthwhile?'},
    customer: {name:'Customer experience lead',quote:'“A cheaper depot is of little use if orders leave late.”',
      text:'Your team recommends keeping mean dispatch lateness below 2 minutes relative to the planned release time. Negative values mean early dispatch. This is a population mean target. You will need separate operational controls for individual late orders.',
      question:'What would count as evidence that the mean dispatch target is met? How should management act if evidence remains inconclusive?'},
    analyst: {name:'Independent analyst',quote:'“A favourable spreadsheet and a defensible population claim are different things.”',
      text:'Check what was sampled and which population each claim concerns. For this exercise, the internal and audit samples are independent, representative draws from stable normal populations for the proposed operation. The known dispatch SD is stipulated. The population SD of daily savings is unknown.',
      question:'Which benchmark answers the business question? Which reference distribution matches each report, and what would a false conclusion cost?'},
  };
  const fresh = () => ({stage:0,role:'finance',initial:'',initialWhy:'',initialLocked:false,
    plan:'',planWhy:'',planLocked:false,auditOpened:false,decision:'',decisionWhy:'',decisionLocked:false,
    scenarioMean:300,scenarioDelay:1.6});
  let state;
  try { state=JSON.parse(localStorage.getItem(KEY)); } catch {}
  if (!state || !Number.isInteger(state.stage) || state.stage<0 || state.stage>=stages.length) state=fresh();
  const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state));}catch{}};
  const spend=()=>state.planLocked?DATA.diligence[state.plan]:0;
  const commitment=()=>state.decisionLocked?({launch:7200,reserve:1000,negotiate:3600,decline:0}[state.decision]):0;
  const cash=()=>DATA.cash-spend()-commitment();
  const selectedAction=(id,initial=false)=>(initial?initialActions:actions).find(item=>item.id===id);
  const selectedPlan=id=>plans.find(item=>item.id===id);
  const polls = {
    first:{label:'First recommendation',question:'Mizan Market has AED 10,000 cash, a 180-day offer at AED 240/day and AED 7,200 setup, plus a vendor pilot claim. What is your initial recommendation?',options:initialActions.map(x=>x.title.slice(4)+'. '+x.detail)},
    diligence:{label:'Buy information',question:'Mizan Market has two uncertain internal reports. Which single diligence plan should the board buy before its deadline?',options:plans.map(x=>x.title.slice(4)+'. '+x.detail)},
    final:{label:'Final board recommendation',question:'The vendor now offers AED 3,600 setup today, AED 3,600 after 30 days and a higher AED 270/day licence. Given the reports and remaining cash, which board action do you recommend?',options:actions.map(x=>x.title.slice(4)+'. '+x.detail)},
    reconsider:{label:'What would change your mind?',question:'Which unresolved issue most affects your recommendation for Mizan Market?',options:['Uncertainty about population mean net savings.','Uncertainty about population mean dispatch lateness.','The upfront cash constraint and implementation terms.','The quality and representativeness of the evidence.']},
  };
  const pollOrigin='https://qba201-classroom-voting.quirkywand37.chatgpt.site';
  $('#team-competition').href=pollOrigin+'/challenge/host#template='+TEAM_PACK.templateId;
  $('#poll-pack').href=pollOrigin+'/host#pack='+encodeURIComponent(JSON.stringify({title:'Mizan Market · The contract decision',polls:Object.values(polls)}));
  function pollLink(id) {
    return `<a target="_blank" rel="noopener" href="${escape(pollOrigin+'/host#draft='+encodeURIComponent(JSON.stringify(polls[id])))}">Open this class vote ↗</a>`;
  }
  function facts(rows) {
    return '<div class="facts">'+rows.map(([title,value,text])=>`<div class="fact"><span>${title}</span><b>${value}</b><p>${text}</p></div>`).join('')+'</div>';
  }
  function options(items,value,kind,locked) {
    return '<div class="options">'+items.map(item=>`<button class="choice ${value===item.id?'selected':''}" data-kind="${kind}" data-value="${item.id}" aria-pressed="${value===item.id}" ${locked?'disabled':''}><strong>${item.title}</strong><small>${item.detail}</small></button>`).join('')+'</div>';
  }
  function lockPrompt(text,index) {
    return `<div class="locked"><h2>Keep the decision sequence intact.</h2><p>${text}</p><button data-go="${index}">Return to that decision →</button></div>`;
  }
  function sampleDocument(kind,audit=false) {
    const savings=kind==='savings';
    const row=DATA[audit?(savings?'savingsAudit':'serviceAudit'):(savings?'initialSavings':'initialService')];
    const title=savings?'Daily gross labour savings':'Dispatch lateness';
    const subtitle=audit?'Independent confirmation report · unused trial records':'Internal pilot report';
    return `<section class="document"><p class="small">${subtitle}</p><h3>${title}</h3><dl><dt>Sample unit</dt><dd>${savings?'Operating day':'Dispatch'}</dd><dt>Sample size</dt><dd>${row.n}</dd><dt>Sample mean</dt><dd>${savings?'AED ':''}${fixed(row.mean,savings?0:2)}${savings?'':' minutes'}</dd><dt>${savings?'Sample SD':'Known population SD'}</dt><dd>${savings?'AED '+row.sd:row.sigma+' minutes'}</dd></dl><p class="small">${savings?'Gross savings are measured before licence and implementation charges. Population SD is unknown.':'Lateness is measured relative to the planned release time. Negative values mean early dispatch. The recommended population mean limit is 2 minutes.'}</p><p class="small">${audit?'This sample is independent of the first pilot. Analyse it as the selected confirmation study.':'Independent random sample from the population for the planned operation.'} Assume stable normal observations.</p></section>`;
  }
  function stageBody(id) {
    if (['evidence','diligence','results','decision','stress','debrief'].includes(id)&&!state.initialLocked)
      return lockPrompt('Record your first recommendation and reason before opening the internal reports.',3);
    if (['results','decision','stress','debrief'].includes(id)&&!state.planLocked)
      return lockPrompt('Select one diligence plan and commit the cash before opening its report.',5);
    if (['decision','stress','debrief'].includes(id)&&!state.auditOpened)
      return lockPrompt('Open the report for the plan you purchased.',6);
    if (['stress','debrief'].includes(id)&&!state.decisionLocked)
      return lockPrompt('Record the final board recommendation before inspecting future scenarios.',7);
    switch (id) {
      case 'mandate':
        return `<p class="lead">An online grocer’s 90-day software trial is ending before its busiest campaign. The vendor promises a cheaper depot. The contract expires at 5 p.m. The owner wants your recommendation.</p><section class="memo"><p class="sender">From Mariam, owner of Mizan Market · Monday morning</p><p class="quote">“We cannot afford a bad contract. We also cannot keep postponing every decision until we are certain.”</p><p>You are the management team for one depot. You can sign, buy time, negotiate conditions or walk away. You will need to defend your choice to the owner.</p></section>${facts([['CASH AUTHORISED TODAY',money(10000),'Audit fees, reservation and setup all come from this amount.'],['THE OFFER','180 operating days','AED 240 per day plus AED 7,200 paid upfront for implementation.'],['THE DEADLINE','5 p.m. today','A non-refundable AED 1,000 reservation buys seven more days at the quoted rate.']])}<section class="record"><h2>Join your team before Round 1</h2><p>Open <strong>Join a team</strong> and enter the class code, or use the lobby link from your instructor. Choose a team and enter your name and student ID. You can see your teammates and switch teams until your instructor locks the rosters.</p><p>Aim for five or six people. One teammate selects <strong>Become captain</strong>, then <strong>Continue to team workspace</strong>. As each round opens, the captain can assign tasks and save team answers. Teammates can send notes and see scores on their team page.</p></section><section class="record"><h2>Winning-team bonus · +1 percentage point of the course grade</h2><p>Your captain saves one set of team answers per round in the team workspace. Fifteen independent questions across three rounds earn 2 points each, for 30 points. The server scores the latest saved answers when each round closes and shows cumulative team ranks. No speed points or instructor marking. Highest-scoring participating teams win. Tied top teams each receive the full bonus. The instructor verifies participation before applying the bonus. No score is assigned to agreement with the class vote.</p></section><p><a href="scoring.html" target="_blank" rel="noopener">See how automatic scoring and team ranks work ↗</a></p><p class="small">Daily licence bills come from the operating budget. Today’s cash must cover upfront commitments.</p>`;
      case 'people': {
        const role=roles[state.role];
        return `<p class="lead">Use the role briefs to share the work. One person can take several roles, and some roles can stay open. Read your own brief, then bring one concern to the team.</p><div class="role-tabs">${Object.entries(roles).map(([key,item])=>`<button data-role="${key}" class="${key===state.role?'active':''}" aria-pressed="${key===state.role}">${item.name}</button>`).join('')}</div><section class="memo"><p class="sender">${role.name} · role brief</p><p class="quote">${role.quote}</p><p>${role.text}</p><div class="warning"><strong>Bring this to the meeting</strong><p>${role.question}</p></div></section><p class="small">Every team can read every brief. The disagreement comes from priorities. Take turns speaking at checkpoints.</p>`;
      }
      case 'pitch':
        return `<p class="lead">The vendor’s account manager forwards the pilot presentation just before your first meeting.</p><section class="memo"><p class="sender">From Samir, vendor account manager · Sales follow-up</p><p class="quote">“Average savings were AED 340 a day. That easily beats a licence price of AED 240. The pilot already proves the business case.”</p><dl><dt>Pilot summary</dt><dd>12 operating days · mean AED 340 · sample SD AED 60</dd></dl><p class="small">Footnote in the presentation. The vendor selected 12 quiet days with experienced staff. No independent dispatch report is attached.</p></section><div class="split"><section><h2>Finance asks</h2><p>What costs are included in that comparison?</p></section><section><h2>The analyst asks</h2><p>Which population does this sample represent?</p></section></div><p class="small">Challenge the claim before trusting the advertised saving. A calculator cannot repair a sampling problem.</p>`;
      case 'initial':
        return `<p class="lead">You have the contract and the sales pitch. Before opening the internal reports, record your team’s position on paper. Your captain saves the first checkpoint in the team challenge. The anonymous class vote is separate.</p>${options(initialActions,state.initial,'initial',state.initialLocked)}<label for="initialWhy">What assumption is doing the most work in your recommendation?</label><textarea id="initialWhy" maxlength="1500" ${state.initialLocked?'disabled':''}>${escape(state.initialWhy)}</textarea><div class="actions">${pollLink('first')}<button class="primary" id="lock-initial" ${state.initialLocked?'disabled':''}>${state.initialLocked?'First position recorded':'Record the class position →'}</button></div>${state.initialLocked?'<div class="record">Your first position is on the record. You may change your recommendation after examining evidence.</div>':''}`;
      case 'evidence':
        return `<p class="lead">Your depot manager has two reports from the planned operation. Neither appears in the sales presentation. You have 13 minutes to advise the board.</p><div class="document-grid">${sampleDocument('savings')}${sampleDocument('service')}</div><section class="memo"><h2>The questions the owner needs answered</h2><ol><li>What daily mean gross saving would cover the whole 180-day contract, including setup?</li><li>Is there evidence that the population mean gross saving exceeds that threshold?</li><li>Is there evidence that population mean dispatch lateness is below the recommended 2-minute limit?</li><li>Which conclusion is most vulnerable, and what would you do about it?</li></ol><p class="small">Use 5% significance, fixed before these reports were opened. Use the general reference tables in the case pack or a suitable calculator. Give the business implication of each result.</p></section><div class="warning"><p>The owner’s cash limit is an implementation constraint. The population mean saving is an economic question. Address both.</p></div>`;
      case 'diligence':
        return `<p class="lead">An independent audit firm can deliver one report package before the deadline. Which plan is worth its cash cost?</p>${options(plans,state.plan,'plan',state.planLocked)}<label for="planWhy">Which uncertainty are you buying down, and what opportunity does the spending take away?</label><textarea id="planWhy" maxlength="1500" ${state.planLocked?'disabled':''}>${escape(state.planWhy)}</textarea><div class="actions">${pollLink('diligence')}<button class="primary" id="lock-plan" ${state.planLocked?'disabled':''}>${state.planLocked?'Diligence plan booked':'Book this plan and commit the cash →'}</button></div><p class="small">Choose once before seeing the new results. Confirmation samples are independent of the first pilot. The audit firm already holds sealed, preselected trial records. The fee pays for verification and release today. It supplies the complete fixed-sample report.</p>${state.planLocked?`<div class="record"><p><strong>${selectedPlan(state.plan).title.slice(4)}</strong></p><p>${money(spend())} committed. ${money(DATA.cash-spend())} remains before any launch or reservation.</p></div>`:''}`;
      case 'results':
        return `<p class="lead">You booked <strong>${selectedPlan(state.plan).title.slice(4).toLowerCase()}</strong>. The audit cost is ${money(spend())}. Cash after the audit, before the contract decision, is ${money(DATA.cash-spend())}.</p>${!state.auditOpened?`<section class="memo"><h2>${state.plan==='none'?'Confirm the evidence you will use':'The independent report is sealed'}</h2><p>${state.plan==='none'?'No new audit has been commissioned. Your final recommendation must use the two internal reports.':'Before opening, state what result would change your mind. Update your recommendation using the report you chose.'}</p><button id="open-audit" class="primary">${state.plan==='none'?'Continue with the internal evidence':'Open the purchased report →'}</button></section>`:`<div class="document-grid">${['savings','both'].includes(state.plan)?sampleDocument('savings',true):sampleDocument('savings')}${['service','both'].includes(state.plan)?sampleDocument('service',true):sampleDocument('service')}</div><div class="warning"><p>${state.plan==='both'?'Buying both audits leaves AED 6,400. The full upfront setup fee is AED 7,200. What financing or contract change would implementation require?':'Reassess the population claims and the available actions. Which issue remains unresolved?'}</p></div><p class="small">Purchased evidence has a sunk cash cost at this stage. It reduces total project returns, but is paid whether you now sign or decline. Compare the future costs and benefits of the remaining choices.</p>`}`;
      case 'decision':
        return `<p class="lead">The cash available for the contract decision is ${money(DATA.cash-spend())}, after audit fees and before any new commitment. The vendor sends a final offer at 4:15 p.m.</p><section class="memo"><p class="sender">From Samir, vendor account manager · 4:15 p.m.</p><h2>“We can split the setup payment.”</h2><p>Pay AED 3,600 today and AED 3,600 after 30 operating days. The daily licence rises from AED 240 to AED 270. The contract still covers 180 operating days.</p><p><strong>We cannot add a performance exit clause.</strong> The original offer is also available until 5 p.m.</p></section><p>Which offer, if any, should the owner accept? Check what this change does to the mean-saving threshold. Your captain opens the final scored questions after the board recommendation is recorded.</p>${options(actions,state.decision,'decision',state.decisionLocked)}<label for="decisionWhy">Defend the recommendation with the population evidence, cash constraint, customer risk and one condition that would make you change your mind.</label><textarea id="decisionWhy" maxlength="2000" ${state.decisionLocked?'disabled':''}>${escape(state.decisionWhy)}</textarea><div class="actions">${pollLink('final')}<button class="primary" id="lock-decision" ${state.decisionLocked?'disabled':''}>${state.decisionLocked?'Board recommendation recorded':'Put the recommendation on record →'}</button></div>${state.decisionLocked?`<div class="record"><p><strong>${selectedAction(state.decision).title.slice(4)}</strong></p><p>${escape(state.decisionWhy)}</p><p>${decisionEffect()}</p></div>`:''}<p class="small">Each team may defend its own recommendation. A staged payment solves a cash-timing problem but changes the price.</p>`;
      case 'stress':
        return `<p class="lead">Your recommendation is on the record. Explore possible population conditions and ask where the business case would fail.</p><div class="record"><strong>${selectedAction(state.decision).title.slice(4)}</strong><p>${decisionEffect()}</p></div><div class="controls"><label for="scenarioMean">Suppose mean gross savings are <output id="mean-output"></output><input id="scenarioMean" type="range" min="240" max="360" step="1" value="${state.scenarioMean}"></label><label for="scenarioDelay">Suppose mean dispatch lateness is <output id="delay-output"></output><input id="scenarioDelay" type="range" min="0" max="4" step=".1" value="${state.scenarioDelay}"></label></div><div id="stress-results"></div><p class="small">These are hypothetical population scenarios. They are not realised outcomes or a revelation of the true mean. The financial calculation holds the population mean, workload and fees fixed over 180 operating days.</p><div class="actions">${pollLink('reconsider')}<button id="export">Save class decision record</button></div>`;
      case 'debrief':
        return `<p class="lead">First, each student writes one sentence identifying the weakest part of the team’s recommendation. Then discuss what the evidence can support.</p><div class="split"><section class="memo"><h2>The position you began with</h2><p><strong>${selectedAction(state.initial,true).title.slice(4)}</strong></p><p>${escape(state.initialWhy)}</p></section><section class="memo"><h2>The position you defended</h2><p><strong>${selectedAction(state.decision).title.slice(4)}</strong></p><p>${escape(state.decisionWhy)}</p></section></div><p>Compare the evidence and the risks behind the two recommendations. Your team’s question feedback becomes available after the instructor finalizes the competition.</p><section class="memo"><h2>Scoreboard and bonus record</h2><p>Close the third scored round after the board recommendation. The server marks all 15 questions, totals the points and ranks teams automatically out of 30. No performance judgment is required. Finalize the result and download the winning members’ bonus list. Each winning member receives one course percentage point after participation checks.</p><p>Do not award points for a fortunate scenario or for agreeing with the class vote. Only the fixed numerical answers and evidence-based choices determine this ranking. Discussion explanations and the class vote do not change the score.</p><div class="actions"><a href="${escape(pollOrigin+'/challenge/host')}" target="_blank" rel="noopener">Open the team scoreboard and answer records ↗</a></div></section>`;
    }
  }
  function decisionEffect() {
    const balance=money(cash());
    if(state.decision==='launch')return `The setup fee is committed. ${balance} remains from the upfront authorisation. Future licence payments require operating cash flow. The service risk still needs management attention.`;
    if(state.decision==='reserve')return `The AED 1,000 fee buys seven more days at the quoted rate. ${balance} remains. The launch is postponed and the opening campaign week is missed.`;
    if(state.decision==='negotiate')return `AED 3,600 setup is committed now and AED 3,600 is due after 30 operating days. ${balance} remains from today’s authorisation. The higher daily fee changes the economic case.`;
    return `No contract has been signed. ${balance} remains. The existing process continues, with the possibility of missing positive net savings.`;
  }
  function renderStress() {
    $('#mean-output').textContent=money(state.scenarioMean)+' per day';
    $('#delay-output').textContent=fixed(state.scenarioDelay,1)+' minutes';
    const license=state.decision==='negotiate'?270:240;
    const gross=180*(state.scenarioMean-license)-7200;
    const afterAudit=gross-spend();
    const x=v=>42+(v-240)/120*606;
    const y=v=>235-(v+18000)/36000*200;
    const points=[240,260,280,300,320,340,360].map(mu=>`${x(mu)},${y(180*(mu-license)-7200-spend())}`).join(' ');
    $('#stress-results').innerHTML=`<section class="stress"><h2>${state.decision==='negotiate'?'Staged-payment contract scenario':'Full-launch scenario under the original offer'}</h2><div class="split"><div><p class="small">Expected 180-day net saving after the audit cost</p><p class="metric ${afterAudit>=0?'profit':'loss'}">${money(afterAudit)}</p><p class="small">180 ×(${state.scenarioMean} −${license}) −7,200 −${spend()}.</p></div><div><p class="small">Dispatch target in this assumed population</p><p class="metric ${state.scenarioDelay<2?'profit':'loss'}">${state.scenarioDelay<2?'Below 2 min':state.scenarioDelay===2?'At 2 min':'Above 2 min'}</p><p class="small">${state.scenarioDelay<2?'The mean meets the customer lead’s preferred condition.':'The assumed population mean fails the preferred strict below 2-minute condition.'}</p></div></div><svg viewBox="0 0 700 285" role="img" aria-label="Scenario line for full-launch expected net saving over population mean daily savings"><line x1="42" y1="${y(0)}" x2="648" y2="${y(0)}" stroke="#c5cfbf"/>${[-18000,-9000,0,9000,18000].map(v=>`<text x="35" y="${y(v)+4}" text-anchor="end" fill="#52645c" font-size="11">${v/1000}k</text>`).join('')}<polyline points="${points}"  fill="none" stroke="#11624b" stroke-width="3"/><circle cx="${x(state.scenarioMean)}" cy="${y(afterAudit)}" r="6" fill="#8a5d20"/>${[240,280,320,360].map(mu=>`<text x="${x(mu)}" y="265" text-anchor="middle" fill="#52645c" font-size="12">${mu}</text>`).join('')}<text x="42" y="20" fill="#52645c" font-size="12">Expected net saving in AED</text><text x="350" y="283" text-anchor="middle" fill="#52645c" font-size="12">Assumed population mean daily gross savings</text></svg><p class="small">The audit is already paid at the contract decision. Compare the forward-looking contract cost with the total project return. This line describes a full launch under a daily fee of AED ${license}. ${['launch','negotiate'].includes(state.decision)?'That is the contract you selected.':state.decision==='decline'?'Your recorded decision declines the offer. The audit expense remains paid, with no setup or licence commitment. Any missed saving depends on the unknown population mean.':'Your recorded action is '+escape(selectedAction(state.decision).title.slice(4).toLowerCase())+'. Later launch and terms remain conditional.'}</p></section>`;
  }
  function render() {
    const [id,label,title]=stages[state.stage];
    $('#stages').innerHTML=stages.map((row,i)=>`<button data-go="${i}" class="${i===state.stage?'active':''}" ${i===state.stage?'aria-current="step"':''}><span>${String(i+1).padStart(2,'0')}</span><span class="nav-name">${row[1]}</span></button>`).join('');
    $('#stage-number').textContent=label;
    $('#cash').textContent='Upfront cash remaining '+money(cash());
    $('#scene').innerHTML='<h1>'+title+'</h1>'+stageBody(id);
    $('#page-count').textContent=(state.stage+1)+' / '+stages.length;
    $('#back').disabled=state.stage===0;
    $('#next').disabled=state.stage===stages.length-1;
    $('#message').textContent='';
    document.title=label+' · Mizan Market';
    if($('#stress-results'))renderStress();
    save();
  }
  function go(index) {
    state.stage=Math.max(0,Math.min(stages.length-1,index));
    render();
    window.scrollTo({top:0,behavior:'auto'});
    $('#main').focus({preventScroll:true});
  }
  function tell(text) {$('#message').textContent=text;}
  function record(type) {
    const config={
      initial:{why:'initialWhy',locked:'initialLocked',min:20,next:4},
      plan:{why:'planWhy',locked:'planLocked',min:20,next:6},
      decision:{why:'decisionWhy',locked:'decisionLocked',min:35,next:8},
    }[type];
    if(state[config.locked])return;
    if(!state[type]||state[config.why].trim().length<config.min){
      tell('Choose an option and record a reason before committing the class decision.');
      return;
    }
    if(type==='decision'){
      const required={launch:7200,reserve:1000,negotiate:3600,decline:0}[state.decision];
      if(required>DATA.cash-spend()){
        tell('This commitment exceeds the remaining cash by '+money(required-(DATA.cash-spend()))+'. Choose a commitment that the remaining cash can fund.');
        return;
      }
    }
    state[config.locked]=true;
    save();
    go(config.next);
  }
  document.addEventListener('click',event=>{
    const button=event.target.closest('button');
    if(!button)return;
    if(button.dataset.go!==undefined)go(Number(button.dataset.go));
    if(button.dataset.role){state.role=button.dataset.role;render();}
    if(button.dataset.kind){
      const kind=button.dataset.kind;
      const lock={initial:'initialLocked',plan:'planLocked',decision:'decisionLocked'}[kind];
      if(!state[lock]){state[kind]=button.dataset.value;render();}
    }
    if(button.id==='lock-initial')record('initial');
    if(button.id==='lock-plan')record('plan');
    if(button.id==='lock-decision')record('decision');
    if(button.id==='open-audit'){state.auditOpened=true;render();}
    if(button.id==='export'){
      const record={case:'Mizan Market',date:new Date().toISOString(),record:state,
        auditSpend:spend(),upfrontCashRemaining:cash(),scope:'Class board record only. Export identified answers, marks and bonus recipients from the team competition.'};
      const url=URL.createObjectURL(new Blob([JSON.stringify(record,null,2)],{type:'application/json'}));
      const a=document.createElement('a');a.href=url;a.download='Mizan_Market_Board_Decision.json';a.click();
      setTimeout(()=>URL.revokeObjectURL(url),1000);
    }
  });
  document.addEventListener('input',event=>{
    if(['initialWhy','planWhy','decisionWhy'].includes(event.target.id)){state[event.target.id]=event.target.value;save();}
    if(event.target.id==='scenarioMean'||event.target.id==='scenarioDelay'){
      state[event.target.id]=Number(event.target.value);save();renderStress();
    }
  });
  $('#back').onclick=()=>go(state.stage-1);
  $('#next').onclick=()=>go(state.stage+1);
  $('#home').onclick=event=>{event.preventDefault();go(0);};
  $('#reset').onclick=()=>{state=fresh();render();tell('Case decisions and the cash balance have been reset.');};
  document.addEventListener('keydown',event=>{
    if(['INPUT','TEXTAREA','SELECT','BUTTON'].includes(document.activeElement.tagName))return;
    if(event.key==='ArrowRight'){event.preventDefault();go(state.stage+1);}
    if(event.key==='ArrowLeft'){event.preventDefault();go(state.stage-1);}
  });
  window.MizanCase={snapshot:()=>JSON.parse(JSON.stringify(state)),data:DATA,stages:stages.map(row=>({id:row[0],label:row[1]}))};
  render();
})();
</script>
</body>
</html>
